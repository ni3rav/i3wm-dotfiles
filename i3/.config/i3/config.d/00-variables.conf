set $mod Mod4
set $alt Mod1

font pango:JetBrainsMono Nerd Font 10

set $ws1 "1"
set $ws2 "2"
set $ws3 "3"
set $ws4 "4"
set $ws5 "5"
set $ws6 "6"

floating_modifier $mod
workspace_layout default

gaps inner 10
gaps outer 4
smart_gaps off
hide_edge_borders none

default_border pixel 3
default_floating_border pixel 3
