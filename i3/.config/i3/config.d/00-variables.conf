# Variables and defaults

set $mod Mod4
set $alt Mod1

font pango:JetBrainsMono Nerd Font 10

# Refresh i3status after volume/mic changes
set $refresh_i3status killall -SIGUSR1 i3status

# Six predefined workspaces
set $ws1 "1"
set $ws2 "2"
set $ws3 "3"
set $ws4 "4"
set $ws5 "5"
set $ws6 "6"

# Move floating windows with $mod + left mouse button
floating_modifier $mod

# Default tiling; spiral layout is enforced by i3-layouts on workspaces 1–6
workspace_layout default
