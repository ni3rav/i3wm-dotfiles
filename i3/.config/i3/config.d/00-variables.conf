set $mod Mod4
set $alt Mod1

font pango:JetBrainsMono Nerd Font 10

set $ws1 "1"
set $ws2 "2"
set $ws3 "3"
set $ws4 "4"
set $ws5 "5"
set $ws6 "6"

# $mod+left-drag moves floating; $mod+right-drag resizes floating
# Tiling: drag the window border/gap edge to resize splits
floating_modifier $mod
tiling_drag modifier
workspace_layout default

gaps inner 4
gaps outer 2
smart_gaps off
hide_edge_borders none

default_border pixel 4
default_floating_border pixel 4
