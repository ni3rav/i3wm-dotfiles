exec --no-startup-id setxkbmap -option caps:escape
exec --no-startup-id numlockx on
exec --no-startup-id picom --daemon
exec --no-startup-id ~/.config/i3/apply-look.sh
exec --no-startup-id dex-autostart --autostart --environment i3
# LightDM greeter lock (password field). Do not also run xss-lock/i3lock.
exec --no-startup-id light-locker --lock-after-screensaver=0 --lock-on-lid --lock-on-suspend
exec_always --no-startup-id ~/.config/polybar/launch.sh
exec_always --no-startup-id ~/.config/i3/start-i3-layouts.sh
