# Autostart (Vicinae is managed by systemd --user, not here)

# Caps Lock acts as Escape (X11)
exec --no-startup-id setxkbmap -option caps:escape

exec --no-startup-id dex-autostart --autostart --environment i3
exec --no-startup-id xss-lock --transfer-sleep-lock -- i3lock --nofork
exec --no-startup-id nm-applet

# Empty workspaces are destroyed by i3 when abandoned. Visibility of all six
# buttons (including empty) is handled by workspace_command in 60-bar.conf.

# i3-layouts daemon (spiral on workspaces 1–6; assigns live in main config)
# exec_always runs on i3 start/restart; reload keybinding also restarts it.
exec_always --no-startup-id ~/.config/i3/start-i3-layouts.sh
