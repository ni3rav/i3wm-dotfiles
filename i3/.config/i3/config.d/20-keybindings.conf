bindsym $mod+Return exec --no-startup-id ghostty --gtk-single-instance=false
bindsym $mod+b exec --no-startup-id firefox --new-window about:blank
bindsym $mod+f exec --no-startup-id nautilus --new-window
bindsym $mod+q kill

bindsym $mod+p exec --no-startup-id dmenu_run -nf '#BBBBBB' -nb '#222222' -sb '#005577' -sf '#EEEEEE' -fn 'JetBrainsMono Nerd Font-10'

bindsym $mod+space exec --no-startup-id vicinae vicinae://toggle
bindsym $mod+v exec --no-startup-id vicinae 'vicinae://launch/clipboard/history?toggle=true'
bindsym $mod+e exec --no-startup-id vicinae 'vicinae://launch/files/search?toggle=true'
bindsym $mod+comma exec --no-startup-id vicinae 'vicinae://launch/core/search-emojis?toggle=true'
bindsym $alt+Tab exec --no-startup-id vicinae 'vicinae://launch/wm/switch-windows?toggle=true'

bindsym $mod+d exec --no-startup-id ~/.config/i3/toggle-windows.sh
bindsym $mod+Shift+d exec --no-startup-id ~/.config/i3/toggle-windows.sh --focused

bindsym XF86AudioRaiseVolume exec --no-startup-id pactl set-sink-volume @DEFAULT_SINK@ +10% && $refresh_i3status
bindsym XF86AudioLowerVolume exec --no-startup-id pactl set-sink-volume @DEFAULT_SINK@ -10% && $refresh_i3status
bindsym XF86AudioMute exec --no-startup-id pactl set-sink-mute @DEFAULT_SINK@ toggle && $refresh_i3status
bindsym XF86AudioMicMute exec --no-startup-id pactl set-source-mute @DEFAULT_SOURCE@ toggle && $refresh_i3status

bindsym $mod+j focus left
bindsym $mod+k focus down
bindsym $mod+i focus up
bindsym $mod+semicolon focus right

bindsym $mod+Left focus left
bindsym $mod+Down focus down
bindsym $mod+Up focus up
bindsym $mod+Right focus right

bindsym $mod+a focus parent
bindsym $mod+Shift+a focus child

bindsym $mod+Shift+j exec --no-startup-id ~/.local/bin/i3l move left
bindsym $mod+Shift+k exec --no-startup-id ~/.local/bin/i3l move down
bindsym $mod+Shift+l exec --no-startup-id ~/.local/bin/i3l move up
bindsym $mod+Shift+semicolon exec --no-startup-id ~/.local/bin/i3l move right

bindsym $mod+Shift+Left exec --no-startup-id ~/.local/bin/i3l move left
bindsym $mod+Shift+Down exec --no-startup-id ~/.local/bin/i3l move down
bindsym $mod+Shift+Up exec --no-startup-id ~/.local/bin/i3l move up
bindsym $mod+Shift+Right exec --no-startup-id ~/.local/bin/i3l move right

bindsym $mod+h split h
bindsym $mod+backslash split v

bindsym $mod+s layout stacking
bindsym $mod+w layout tabbed
bindsym $mod+t layout toggle split

bindsym $mod+Shift+f exec --no-startup-id ~/.config/i3/toggle-maximize.sh
bindsym $mod+Control+f fullscreen toggle
bindsym $mod+Shift+space floating toggle

bindsym $mod+l exec --no-startup-id loginctl lock-session
bindsym $mod+Shift+c exec --no-startup-id ~/.config/i3/start-i3-layouts.sh; reload
bindsym $mod+Shift+r restart
bindsym $mod+Shift+e exec "i3-nagbar -t warning -m 'Do you really want to exit i3?' -B 'Yes, exit i3' 'i3-msg exit'"
