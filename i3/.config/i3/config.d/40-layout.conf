# Layout: i3-layouts "spiral" on workspaces 1–6
#
# Package: i3-layouts (pip --user), started by start-i3-layouts.sh
# Assigns: set $i3l spiral … in the main config (required — see that file)
#
# spiral: each new window splits the previous; direction alternates
# horizontal / vertical.
#
# Moves are forwarded through `i3l` so containers stay in the spiral.
# Manual split / stacking / tabbed bindings remain available as overrides.
