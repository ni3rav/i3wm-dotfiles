# i3bar — dark theme aligned with client colors; status via i3status
# Evaluated i3status (installed) vs i3status-rust (not installed): keep i3status.

bar {
    position top
    status_command i3status -c ~/.config/i3status/config
    # Always show workspaces 1–6 (including empty); see i3bar-workspaces.sh
    workspace_command ~/.config/i3/i3bar-workspaces.sh
    font pango:JetBrainsMono Nerd Font 10
    separator_symbol " · "
    workspace_buttons yes
    strip_workspace_numbers no
    binding_mode_indicator yes

    colors {
        background #1A1A1A
        statusline #E0E0E0
        separator  #555555

        # border / background / text
        focused_workspace  #83CAFA #51A2DA #FFFFFF
        active_workspace   #3C6EB4 #294172 #FFFFFF
        inactive_workspace #4C4C4C #2A2A2A #AAAAAA
        urgent_workspace   #EC69A0 #DB3279 #FFFFFF
        binding_mode       #b691d3 #A07CBC #FFFFFF
    }
}
