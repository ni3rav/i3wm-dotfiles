# Day-to-day look — change anything here, then run ONCE:
#   ~/.config/i3/apply-look.sh
# That propagates wallpaper to desktop, lock, and LightDM login.

wallpaper = extra/themes/tokyo-night/wallpapers/5-oma-cityscape.jpg
gtk_theme = Tokyonight-BL-LB-Dark
icon_theme = Tela-circle-dark
cursor_theme = Bibata-Modern-Classic
cursor_size = 24
