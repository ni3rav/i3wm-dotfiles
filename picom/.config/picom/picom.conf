backend = "glx"
vsync = true
use-damage = true
detect-client-opacity = true
detect-rounded-corners = true
detect-transient = true

shadow = false

fading = true
fade-in-step = 0.03
fade-out-step = 0.03

blur-method = "dual_kawase"
blur-strength = 7
blur-background = true

corner-radius = 0
frame-opacity = 1.0

animations = ({
	triggers = [ "open", "show" ];
	preset = "appear";
	scale = 0.92;
	duration = 0.12;
}, {
	triggers = [ "close", "hide" ];
	preset = "disappear";
	scale = 0.92;
	duration = 0.1;
});

rules: ({
	# Top bar (dock) — same kawase blur as Ghostty
	match = "class_g = 'Polybar' || class_g = 'polybar'";
	blur-background = true;
	animations = [];
}, {
	# Vicinae launcher
	match = "class_g = 'vicinae' || class_g = 'Vicinae'";
	blur-background = true;
	animations = [];
}, {
	match = "window_type = 'desktop'";
	blur-background = false;
	animations = [];
}, {
	match = "window_type = 'tooltip' || window_type = 'menu' || window_type = 'dropdown_menu' || window_type = 'popup_menu'";
	fade = false;
	blur-background = false;
	animations = [];
}, {
	match = "class_g = 'i3-frame' || class_g = 'i3bar'";
	blur-background = false;
	animations = [];
});
