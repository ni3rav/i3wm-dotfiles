include-file = ~/.config/polybar/colors.ini
include-file = ~/.config/polybar/modules.ini

[bar/main]
monitor = ${env:MONITOR:}
monitor-fallback =
monitor-strict = false
override-redirect = false
bottom = false
fixed-center = true

width = 100%
height = 34
offset-x = 0
offset-y = 0

background = ${color.background}
foreground = ${color.foreground}

radius = 0
line-size = 0
border-size = 0
padding-left = 0
padding-right = 1
module-margin-left = 0
module-margin-right = 1

font-0 = JetBrainsMono Nerd Font:size=10;4
font-1 = JetBrainsMono Nerd Font:size=13;4
font-2 = JetBrainsMono Nerd Font:style=Bold:size=11;4

modules-left = workspaces
modules-center = date
modules-right = tray backlight pulseaudio battery power wifi tether bluetooth media

separator =
dim-value = 1.0
enable-ipc = true
cursor-click = pointer
cursor-scroll = ns-resize

[settings]
screenchange-reload = true
compositing-background = source
compositing-foreground = over
pseudo-transparency = false
