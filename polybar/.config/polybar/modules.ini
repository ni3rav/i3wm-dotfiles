[module/workspaces]
type = custom/script
exec = ~/.config/polybar/workspaces.sh
interval = 0.25
format = <label>
format-padding = 0
label = %output%

[module/date]
type = internal/date
interval = 1
date = %a %b %d, %H:%M
format = <label>
format-font = 3
format-padding = 1
label = %date%

[module/cpu]
type = internal/cpu
interval = 1
format = <label>
format-prefix = "󰍛 "
format-prefix-font = 2
format-padding = 1
label = %percentage%%
click-left = ~/.config/polybar/panel.sh monitor

[module/memory]
type = internal/memory
interval = 1
format = <label>
format-prefix = "󰘚 "
format-prefix-font = 2
format-padding = 1
label = %percentage_used%%
click-left = ~/.config/polybar/panel.sh monitor

[module/backlight]
type = custom/script
exec = ~/.config/polybar/brightness.sh
interval = 1
format = <label>
format-padding = 1
label = %output%
click-left = ~/.config/polybar/panel.sh brightness
click-right = ~/.config/polybar/panel.sh brightness
scroll-up = ~/.config/polybar/brightness.sh up
scroll-down = ~/.config/polybar/brightness.sh down

[module/pulseaudio]
type = custom/script
exec = ~/.config/polybar/volume.sh
interval = 1
format = <label>
format-padding = 1
label = %output%
click-left = ~/.config/polybar/panel.sh volume
click-right = ~/.config/polybar/panel.sh volume
click-middle = ~/.config/polybar/volume.sh mute
scroll-up = ~/.config/polybar/volume.sh up
scroll-down = ~/.config/polybar/volume.sh down

[module/wifi]
type = custom/script
exec = ~/.config/polybar/wifi.sh
interval = 2
format = <label>
format-padding = 1
label = %output%
click-left = ~/.config/polybar/panel.sh network
click-right = ~/.config/polybar/panel.sh network

[module/tether]
type = custom/script
exec = ~/.config/polybar/tether.sh
interval = 2
format = <label>
format-padding = 1
label = %output%
click-left = ~/.config/polybar/panel.sh network
click-right = ~/.config/polybar/panel.sh network

[module/bluetooth]
type = custom/script
exec = ~/.config/polybar/bluetooth.sh
interval = 5
format = <label>
format-padding = 1
label = %output%
click-left = ~/.config/polybar/panel.sh bluetooth
click-right = ~/.config/polybar/panel.sh bluetooth

[module/media]
type = custom/script
exec = ~/.config/polybar/media.sh
interval = 1
format = <label>
format-padding = 1
label = %output%
click-right = ~/.config/polybar/media-panel.sh

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC0
full-at = 98
poll-interval = 5
time-format = %H:%M
format-charging = <animation-charging> <label-charging>
format-charging-padding = 1
format-discharging = <ramp-capacity> <label-discharging>
format-discharging-padding = 1
format-full = <label-full>
format-full-prefix = "󰁹 "
format-full-prefix-font = 2
format-full-padding = 1
label-charging = %percentage%%
label-discharging = %percentage%%
label-full = %percentage%%
ramp-capacity-0 = 󰁺
ramp-capacity-1 = 󰁻
ramp-capacity-2 = 󰁼
ramp-capacity-3 = 󰁽
ramp-capacity-4 = 󰁾
ramp-capacity-5 = 󰁿
ramp-capacity-6 = 󰂀
ramp-capacity-7 = 󰂁
ramp-capacity-8 = 󰂂
ramp-capacity-9 = 󰁹
ramp-capacity-font = 2
animation-charging-0 = 󰢜
animation-charging-1 = 󰂆
animation-charging-2 = 󰂇
animation-charging-3 = 󰂈
animation-charging-4 = 󰂉
animation-charging-5 = 󰂊
animation-charging-6 = 󰂋
animation-charging-7 = 󰂅
animation-charging-font = 2
animation-charging-framerate = 750
click-left = ~/.config/polybar/panel.sh battery
click-right = ~/.config/polybar/panel.sh battery

[module/tray]
type = internal/tray
format = <tray>
format-padding = 1
format-margin = 0
tray-spacing = 6px
tray-padding = 0
tray-size = 66%

[module/power]
type = custom/script
exec = ~/.config/polybar/power-profile.sh
interval = 5
click-left = ~/.config/polybar/panel.sh performance
click-right = ~/.config/polybar/panel.sh performance
format = <label>
format-prefix = "󰓅 "
format-prefix-font = 2
format-padding = 1
label = %output%
