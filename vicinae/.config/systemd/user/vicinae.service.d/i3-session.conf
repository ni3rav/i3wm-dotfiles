# LightDM + i3 never activates graphical-session.target (RefuseManualStart; no uwsm).
# Add WantedBy=default.target so the enabled unit starts at login.
# Docs: https://docs.vicinae.com/quickstart/generic
# Note: do not `systemctl disable` a stowed unit symlink — systemd may delete it.

[Install]
WantedBy=default.target
